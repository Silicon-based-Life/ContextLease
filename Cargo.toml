[workspace]
members = [
  "rust/contextlease-core",
  "rust/contextlease-ffi",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Silicon-based-Life/ContextLease"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "=0.3.36", features = ["formatting"] }
