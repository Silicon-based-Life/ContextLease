[workspace]
members = [
  "rust/contextlease-core",
  "rust/contextlease-ffi",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Silicon-based-Life/ContextLease"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha2 0.11 requires Rust 1.85 and an API migration. Keep this requirement
# within the Rust 1.75-compatible 0.10.x line until that migration is approved.
sha2 = "0.10"
