<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">ContextLease Debug Web</title>
  <desc id="desc">Dashboard showing prompt context utilization, module budgets, revocable leases, and allocation events</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d1c2d"/></linearGradient>
    <linearGradient id="used" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5de4c7"/><stop offset="1" stop-color="#82aaff"/></linearGradient>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .label{fill:#6f879f;font-size:13px}.value{fill:#f1f6fb;font-weight:700}.line{stroke:#20364d}.panel{fill:#0d1b2b;stroke:#24394f}
      .th{fill:#607991;font-size:12px}.td{fill:#bdccda;font-size:13px}.event{fill:#91a8be;font-size:12px}
    </style>
  </defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <g class="ui">
    <rect width="1440" height="72" fill="#091522"/>
    <g transform="translate(34 20)">
      <rect width="32" height="32" rx="8" fill="#142b3e" stroke="#2e5066"/>
      <rect x="7" y="7" width="18" height="5" rx="2.5" fill="#294458"/>
      <rect x="7" y="14" width="12" height="5" rx="2.5" fill="#5de4c7"/>
      <rect x="7" y="21" width="7" height="4" rx="2" fill="#82aaff"/>
      <text x="44" y="22" class="value" font-size="18">ContextLease</text>
      <text x="185" y="22" class="label mono">DEBUG WEB</text>
    </g>
    <g transform="translate(1110 20)">
      <rect width="160" height="32" rx="8" fill="#0c1a29" stroke="#2a4056"/>
      <text x="14" y="21" class="td mono">agent-demo⌄</text>
      <circle cx="185" cy="16" r="5" fill="#5de4c7"/>
      <text x="198" y="21" fill="#75d9c5" font-size="12" class="mono">LIVE</text>
    </g>

    <g transform="translate(34 98)">
      <text class="label mono" x="0" y="0">CONTEXT UTILIZATION</text>
      <text class="value" x="0" y="42" font-size="32">94,720 <tspan fill="#526c84" font-size="20">/ 112,640</tspan></text>
      <text x="314" y="38" fill="#f2a66f" font-size="12" class="mono">ELEVATED PRESSURE</text>
      <rect x="0" y="62" width="1372" height="18" rx="9" fill="#172a3d"/>
      <rect x="0" y="62" width="995" height="18" rx="9" fill="url(#used)"/>
      <rect x="995" y="62" width="188" height="18" fill="#283d52"/>
      <rect x="1183" y="62" width="22" height="18" fill="#b384df"/>
      <rect x="1205" y="62" width="167" height="18" rx="0 9 9 0" fill="#ef9f66"/>
      <g transform="translate(0 108)">
        <g><text class="label mono">UTILIZATION</text><text class="value" y="34" font-size="25">84%</text></g>
        <g transform="translate(220)"><text class="label mono">RECLAIMABLE</text><text class="value" y="34" font-size="25">66,700</text></g>
        <g transform="translate(470)"><text class="label mono">ACTIVE LEASES</text><text class="value" y="34" font-size="25">3</text></g>
        <g transform="translate(690)"><text class="label mono">SLACK</text><text class="value" y="34" font-size="25">17,920</text></g>
        <text x="980" y="20" class="label mono">model-128k · estimated · seq 4 · 17:31:04</text>
      </g>
    </g>

    <g transform="translate(34 285)">
      <rect width="910" height="272" rx="14" class="panel"/>
      <text x="20" y="30" class="value" font-size="15">Module allocation</text>
      <text x="20" y="51" class="label">Floor / target / max, current demand, and borrowed capacity</text>
      <g transform="translate(20 76)">
        <text class="th mono" x="0">MODULE</text><text class="th mono" x="178">FLOOR / TARGET / MAX</text><text class="th mono" x="390">DEMAND</text><text class="th mono" x="500">USED</text><text class="th mono" x="605">BORROWED</text><text class="th mono" x="740">PRESSURE</text>
        <path d="M0 16h870" class="line"/>
        <g transform="translate(0 46)" class="td mono"><text>system_contract</text><text x="178">12k / 14k / 14k</text><text x="390">13,820</text><text x="500">13,820</text><text x="605">0</text><text x="740" fill="#5de4c7">normal</text></g>
        <path d="M0 62h870" class="line"/>
        <g transform="translate(0 91)" class="td mono"><text>tool_catalog</text><text x="178">6k / 12k / 18k</text><text x="390">10,800</text><text x="500">10,800</text><text x="605">0</text><text x="740" fill="#ef9f66">critical</text></g>
        <path d="M0 107h870" class="line"/>
        <g transform="translate(0 136)" class="td mono"><text>retrieval</text><text x="178">8k / 24k / 48k</text><text x="390">40,120</text><text x="500">33,200</text><text x="605" fill="#82aaff">9,500</text><text x="740" fill="#ef9f66">critical</text></g>
        <path d="M0 152h870" class="line"/>
        <g transform="translate(0 181)" class="td mono"><text>memory</text><text x="178">7k / 18k / 36k</text><text x="390">27,800</text><text x="500">21,900</text><text x="605" fill="#82aaff">4,100</text><text x="740" fill="#ef9f66">critical</text></g>
      </g>
    </g>

    <g transform="translate(966 285)">
      <rect width="440" height="272" rx="14" class="panel"/>
      <text x="20" y="30" class="value" font-size="15">Live events</text>
      <text x="390" y="30" text-anchor="end" class="label mono">7 events</text>
      <g transform="translate(20 64)" class="mono">
        <circle cx="5" cy="0" r="4" fill="#5de4c7"/><text x="20" y="4" class="event">request.completed</text><text x="355" y="4" class="label">now</text>
        <path d="M5 8v23" class="line"/>
        <circle cx="5" cy="39" r="4" fill="#82aaff"/><text x="20" y="43" class="event">context.rendered</text><text x="355" y="43" class="label">now</text>
        <path d="M5 47v23" class="line"/>
        <circle cx="5" cy="78" r="4" fill="#b384df"/><text x="20" y="82" class="event">chunk.compressed · memory</text><text x="355" y="82" class="label">now</text>
        <path d="M5 86v23" class="line"/>
        <circle cx="5" cy="117" r="4" fill="#ef9f66"/><text x="20" y="121" class="event">lease.reclaimed · retrieval</text><text x="355" y="121" class="label">now</text>
        <path d="M5 125v23" class="line"/>
        <circle cx="5" cy="156" r="4" fill="#b384df"/><text x="20" y="160" class="event">chunk.compressed · retrieval</text><text x="355" y="160" class="label">now</text>
      </g>
    </g>

    <g transform="translate(34 579)">
      <rect width="1372" height="205" rx="14" class="panel"/>
      <text x="20" y="30" class="value" font-size="15">Revocable token leases</text>
      <text x="20" y="51" class="label">Donor capacity is reclaimed through the borrower's pre-registered release pipeline</text>
      <g transform="translate(20 78)">
        <text class="th mono" x="0">DONOR</text><text class="th mono" x="220">BORROWER</text><text class="th mono" x="420">GRANTED</text><text class="th mono" x="545">USED</text><text class="th mono" x="660">RELEASE PIPELINE</text><text class="th mono" x="1240">STATE</text>
        <path d="M0 16h1332" class="line"/>
        <g transform="translate(0 48)" class="td mono"><text>tool_catalog</text><text x="220" fill="#82aaff">retrieval</text><text x="420">1,200</text><text x="545">1,200</text><text x="660">deduplicate → semantic summary → boundary</text><text x="1240" fill="#5de4c7">active</text></g>
        <path d="M0 65h1332" class="line"/>
        <g transform="translate(0 97)" class="td mono"><text>conversation</text><text x="220" fill="#82aaff">retrieval</text><text x="420">6,500</text><text x="545">6,500</text><text x="660">priority select → semantic summary</text><text x="1240" fill="#5de4c7">active</text></g>
      </g>
    </g>
  </g>
</svg>
