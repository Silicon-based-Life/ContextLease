version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # ContextLease promises Rust 1.75 support. sha2 0.11 requires a newer
      # toolchain and contains API changes, so crossing this compatibility
      # boundary must be an explicit maintainer decision.
      - dependency-name: sha2
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /bindings/dotnet
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
