name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: python scripts/verify_release_versions.py
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdist
          path: dist/*

  python-wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: python-wheel-linux-x86_64
          - os: windows-latest
            artifact: python-wheel-windows-x86_64
          - os: macos-14
            artifact: python-wheel-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/verify_python_wheel.py
      - run: python scripts/verify_installed_wheel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl

  native-sdk:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            library: target/release/libcontextlease_native.so
          - os: windows-latest
            platform: windows-x86_64
            library: target/release/contextlease_native.dll
          - os: macos-14
            platform: macos-arm64
            library: target/release/libcontextlease_native.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: cargo build -p contextlease-ffi --release
      - run: python scripts/package_native.py --platform ${{ matrix.platform }} --library ${{ matrix.library }} --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/*

  dotnet-package:
    needs: native-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true
      - run: python scripts/prepare_dotnet_native_assets.py --artifacts native-artifacts
      - run: dotnet pack bindings/dotnet/src/ContextLease.Managed/ContextLease.Managed.csproj -c Release -o dist
      - run: python scripts/verify_dotnet_package.py
      - run: python scripts/verify_dotnet_consumer.py --source dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-package
          path: dist/*.nupkg

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-and-python, python-wheels, native-sdk, dotnet-package]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Generate SHA256 checksums
        run: |
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - name: Attest release artifacts
        if: github.event.repository.private == false
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: artifacts/**/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/**/* artifacts/SHA256SUMS.txt --generate-notes --verify-tag
