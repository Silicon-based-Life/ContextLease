name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/verify_release_versions.py
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  native-sdk:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            library: target/release/libcontextlease_native.so
          - os: windows-latest
            platform: windows-x86_64
            library: target/release/contextlease_native.dll
          - os: macos-14
            platform: macos-arm64
            library: target/release/libcontextlease_native.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo build -p contextlease-ffi --release
      - run: python scripts/package_native.py --platform ${{ matrix.platform }} --library ${{ matrix.library }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/*

  dotnet-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet pack bindings/dotnet/src/ContextLease.Managed/ContextLease.Managed.csproj -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-package
          path: dist/*.nupkg

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-and-python, native-sdk, dotnet-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA256 checksums
        run: |
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/**/* artifacts/SHA256SUMS.txt --generate-notes --verify-tag
