name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install . --no-build-isolation
      - name: Compile Python
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: contextlease validate examples/demo.json

  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/contextlease/debug/static/app.js
      - run: node --check docs/site.js

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: contextlease-wheel
          path: dist/*.whl
